name: Build Agent

# 推送 v* tag 时构建全部平台并发布; 手动触发时可用指定版本号发布,
# pull_request 只做编译检查.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'agent/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/agent.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号, 例如 v0.1.0. 填写后会创建同名 Release.'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: 检查 (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: check

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test --all

  build:
    name: 构建 ${{ matrix.target }}
    # tag 推送或手动触发时构建产物. 手动触发未填版本号时仍会构建,
    # 但产物只作为 workflow artifacts, 不会创建 Release.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # 产物统一按 `{os}-{arch}` 命名, 与安装脚本的拼装规则保持一致.
          # Linux 使用 musl 静态链接: 单份产物即可在 glibc 与 musl
          # 发行版上运行, 不再区分 libc 打包.
          - target: x86_64-unknown-linux-musl
            platform: linux-x86_64
            os: ubuntu-latest
            archive: tar.gz
            binary: monix-agent

          - target: aarch64-unknown-linux-musl
            platform: linux-aarch64
            os: ubuntu-latest
            archive: tar.gz
            binary: monix-agent

          # armv7: 树莓派等 32 位 ARM 设备.
          - target: armv7-unknown-linux-musleabihf
            platform: linux-armv7
            os: ubuntu-latest
            archive: tar.gz
            binary: monix-agent

          # macOS 统一使用 macos-latest (arm64). x86_64 目标在 arm64 runner 上
          # 交叉编译: Apple 工具链原生支持双架构, Rust 也提供对应 std.
          - target: aarch64-apple-darwin
            platform: darwin-aarch64
            os: macos-latest
            archive: tar.gz
            binary: monix-agent

          - target: x86_64-apple-darwin
            platform: darwin-x86_64
            os: macos-latest
            archive: tar.gz
            binary: monix-agent

          - target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            os: windows-latest
            archive: zip
            binary: monix-agent.exe

          - target: aarch64-pc-windows-msvc
            platform: windows-aarch64
            os: windows-latest
            archive: zip
            binary: monix-agent.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}

      # musl 为静态链接, ring 的 C 代码仍需目标平台的交叉编译器.
      - name: 安装 Linux 交叉编译工具链 (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
          # 用 gcc 包装成 musl 交叉编译器, 供 ring 的 cc-rs 构建使用.
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc /usr/local/bin/aarch64-linux-musl-gcc
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_musl=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"

      - name: 安装 musl 工具链 (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config

      # armv7 需要 armhf 交叉链接器与 musl 头文件.
      - name: 安装 armv7 交叉编译工具链
        if: matrix.target == 'armv7-unknown-linux-musleabihf'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf musl-tools
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
          echo "CC_armv7_unknown_linux_musleabihf=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
          echo "AR_armv7_unknown_linux_musleabihf=arm-linux-gnueabihf-ar" >> "$GITHUB_ENV"

      # macOS 统一在 arm64 的 macos-latest 上构建. x86_64 属于交叉编译:
      # ring 的 C 部分需要通过包装脚本让 clang 带上 -arch x86_64.
      - name: 配置 macOS 交叉编译 (x86_64)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"

          # cc-rs 不接受带空格的可执行名, 这里生成固定带参数的包装脚本.
          # heredoc 内容不能有缩进, 否则 shebang 失效.
          printf '%s\n' \
            '#!/bin/bash' \
            'exec xcrun --sdk macosx clang -arch x86_64 "$@"' \
            > "$RUNNER_TEMP/clang-x86_64"
          chmod +x "$RUNNER_TEMP/clang-x86_64"

          echo "CC_x86_64_apple_darwin=$RUNNER_TEMP/clang-x86_64" >> "$GITHUB_ENV"
          echo "AR_x86_64_apple_darwin=$(xcrun --sdk macosx --find ar)" >> "$GITHUB_ENV"

      - name: 构建
        run: cargo build --release --target ${{ matrix.target }}

      - name: 打包 (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          staging="monix-agent-${{ matrix.platform }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$staging/"
          cp README.md "$staging/" 2>/dev/null || true
          tar -czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      - name: 打包 (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "monix-agent-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" $staging
          Copy-Item README.md $staging -ErrorAction SilentlyContinue
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: monix-agent-${{ matrix.platform }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      # 附带 SHA-256 清单, 供安装脚本校验完整性.
      - name: 生成校验和
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "$ASSET" > "$ASSET.sha256" 2>/dev/null || shasum -a 256 "$ASSET" > "$ASSET.sha256"
          echo "CHECKSUM=$ASSET.sha256" >> "$GITHUB_ENV"

      - name: 上传校验和
        uses: actions/upload-artifact@v7
        with:
          name: monix-agent-${{ matrix.platform }}-sha256
          path: ${{ env.CHECKSUM }}
          if-no-files-found: error

  release:
    name: 发布 Release
    # tag 推送时自动发布; 手动触发时仅在填了版本号后发布.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 解析版本号
        id: version
        run: |
          set -euo pipefail
          # tag 触发用 tag 名, 手动触发用输入的版本号.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          # 统一补上 v 前缀, 并拒绝非法字符.
          case "$VERSION" in
            v*) ;;
            *) VERSION="v$VERSION" ;;
          esac
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号格式无效: $VERSION (应形如 v0.1.0)"
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "发布版本: $VERSION"

      - name: 下载全部产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出产物
        run: ls -lh artifacts

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
