[package]
name = "monix-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Monix 服务器监控 Agent"

[[bin]]
name = "monix-agent"
path = "agent/src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "process", "time", "sync", "io-util", "fs"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
portable-pty = "0.9"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
